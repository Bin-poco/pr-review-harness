[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "pr-review-harness"
version = "0.1.0"
description = "A learning project for evidence-aware Python pull request review."
requires-python = ">=3.11"
dependencies = ["deepagents==0.7.21", "langchain-openai==1.6.7"]

[project.scripts]
pr-harness = "pr_review_harness.cli:main"

[dependency-groups]
dev = ["pytest>=8,<10", "ruff>=0.15,<1"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]
