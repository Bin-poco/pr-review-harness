name: PR review harness

on:
  pull_request_target:
    types: [opened, reopened, synchronize, ready_for_review]
  workflow_dispatch:
    inputs:
      pr_number:
        description: PR number in this repository (manual runs may review drafts)
        required: true
        type: string

# Opt in after installing this workflow on the trusted default branch.
# The harness repository must contain the source and uv.lock. For another
# business repository, generate its caller with `scripts/install_workflow.py`.
permissions:
  contents: read
  pull-requests: write

concurrency:
  group: harness-${{ github.repository }}-${{ github.event.pull_request.number || inputs.pr_number }}
  cancel-in-progress: true

jobs:
  review:
    if: vars.HARNESS_ENABLED == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Check out trusted harness source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Set up uv and Python
        uses: astral-sh/setup-uv@94527f2e458b27549849d47d273a16bec83a01e9 # v7
        with:
          version: '0.11.28'
          python-version: '3.12'
          enable-cache: false
      - name: Install locked trusted dependencies
        run: uv sync --frozen --no-dev
      - name: Review event and generate publication preview
        env:
          HARNESS_API_KEY: ${{ secrets.HARNESS_API_KEY }}
          HARNESS_GITHUB_TOKEN: ${{ github.token }}
          HARNESS_MODEL: ${{ vars.HARNESS_MODEL || 'deepseek-flash' }}
          HARNESS_BASE_URL: ${{ vars.HARNESS_BASE_URL || 'https://api.deepseek.com' }}
          HARNESS_CI_PUBLISH: ${{ vars.HARNESS_PUBLISH || 'false' }}
          HARNESS_CI_MEMORY: ${{ vars.HARNESS_MEMORY_ENABLED || 'false' }}
        shell: bash
        run: |
          args=()
          if [ "$HARNESS_CI_PUBLISH" = 'true' ]; then args+=(--send); fi
          if [ "$HARNESS_CI_MEMORY" = 'true' ]; then args+=(--github-memory); fi
          uv run --frozen --no-dev pr-harness github-ci \
            --event-file "$GITHUB_EVENT_PATH" \
            --repository "$GITHUB_REPOSITORY" \
            --thinking-mode disabled --verify \
            --out outputs/ci "${args[@]}"
      - name: Save review and diagnostics
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: harness-${{ github.run_id }}-${{ github.run_attempt }}
          path: outputs/ci/
          if-no-files-found: ignore
          retention-days: 7
